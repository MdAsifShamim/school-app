spring.config.activate.on-profile=prod

#PROJECT CONFIG
spring.application.name=${SPRING_APP_NAME:SchoolApplication}

#DATABASE CONFIG
spring.datasource.url=jdbc:postgresql://${HOST_NAME:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}?currentSchema=${SCHEMA_NAME:schoolapp}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:system}


spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}

#SERVER PORT RUNNING CONFIG
server.port=${SERVER_PORT:8082}

#SERVER SESSION CONFIG
server.servlet.session.timeout=${SESSION_TIMEOUT:20m}

#INMEMORY DB CONFIG
#spring.security.user.name=asif
#spring.security.user.password=12345

#LOGGING CONFIG
logging.pattern.console = ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:ERROR}